<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Conheça o catálogo da Universo Pixelado: cópia, digitalização, chaveiros, adesivos e outros produtos."
  >

  <title>Universo Pixelado | Catálogo</title>

  <style>
    /* ====================================
       CORES E ESTILOS GERAIS
       ==================================== */

    :root {
      --fundo: #faf7ff;
      --texto: #302448;
      --suave: #756885;
      --roxo: #7544c6;
      --borda: #e9def5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid #c62e7a;
      outline-offset: 4px;
    }

    [hidden] {
      display: none !important;
    }

    /* ====================================
       CABEÇALHO COM IMAGEM DE FUNDO
       ==================================== */

    header {
      padding: 56px 20px;
      text-align: center;
      background-color: #e5d4ff;

      /*
        A camada clara ajuda na leitura dos textos.

        Para mostrar mais a imagem, diminua os dois
        valores 0.78, por exemplo, para 0.35.
      */

      background-image:
        linear-gradient(
          rgba(250, 247, 255, 0.78),
          rgba(250, 247, 255, 0.78)
        ),
        url("imagens/cabeçalho.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      border-bottom: 3px solid var(--borda);
    }

    .marca {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }

    .logo {
      width: 160px;
      height: 160px;
      flex-shrink: 0;

      display: grid;
      place-items: center;
      overflow: hidden;

      background: white;
      border: 3px solid var(--roxo);
      border-radius: 26px;
      box-shadow: 5px 5px 0 #7544c630;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -1px;
    }

    .subtitulo {
      margin: 6px 0 0;
      color: #614a7b;
    }

    .apresentacao {
      max-width: 550px;
      margin: 24px auto 0;
    }

    /* ====================================
       CATEGORIAS PRINCIPAIS
       ==================================== */

    main {
      width: min(1100px, 100%);
      margin: auto;
      padding: 32px 20px 48px;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .filtros button {
      padding: 12px 20px;

      background: white;
      color: var(--roxo);

      border: 2px solid var(--borda);
      border-radius: 12px;

      font-weight: bold;
      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s;
    }

    .filtros button:hover {
      background: #f0e7ff;
      transform: translateY(-2px);
    }

    .filtros button[aria-pressed="true"] {
      background: var(--roxo);
      border-color: var(--roxo);
      color: white;
    }

    /* ====================================
       SUBCATEGORIAS DOS CHAVEIROS
       ==================================== */

    .subcategorias {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;

      margin: -8px 0 24px;
    }

    .subcategorias button {
      padding: 9px 14px;

      background: white;
      color: var(--roxo);

      border: 1px solid var(--borda);
      border-radius: 20px;

      font-size: 14px;
      cursor: pointer;
    }

    .subcategorias button:hover {
      background: #f0e7ff;
    }

    .subcategorias button[aria-pressed="true"] {
      background: #e5d4ff;
      color: var(--texto);
      border-color: var(--roxo);
      font-weight: bold;
    }

    /* ====================================
       CATÁLOGO E CARDS
       ==================================== */

    .resumo {
      margin: 0 0 24px;
      text-align: center;
      color: var(--suave);
      font-size: 14px;
    }

    .catalogo {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(min(100%, 280px), 1fr));

      gap: 24px;
      align-items: start;
    }

    .produto {
      min-width: 0;
      overflow: hidden;

      background: white;
      border: 1px solid var(--borda);
      border-radius: 18px;

      box-shadow: 0 6px 20px #30244808;
    }

    /* ====================================
       CARROSSEL DE FOTOS E VÍDEOS
       ==================================== */

    .carrossel {
      background: #f4edff;
    }

    .carrossel-tela {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
    }

    .carrossel-tela > img,
    .carrossel-tela > video,
    .carrossel-tela > .sem-midia {
      position: absolute;
      inset: 0;

      display: block;
      width: 100%;
      height: 100%;
      margin: 0;

      object-fit: contain;
    }

    .carrossel-tela > video {
      background: #171020;
    }

    .carrossel-tela > .sem-midia {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;

      padding: 24px;
      text-align: center;

      background:
        linear-gradient(135deg, #f0e5ff, #ffeaf3);
    }

    .sem-midia-emoji {
      font-size: 64px;
    }

    .sem-midia-texto {
      max-width: 240px;
      margin: 0;
      color: var(--suave);
      font-size: 14px;
    }

    .foto-ampliavel {
      cursor: zoom-in;
    }

    .carrossel-controles {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 10px 14px;
      border-top: 1px solid var(--borda);
    }

    .carrossel-controles button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;

      background: white;
      color: var(--roxo);

      border: 1px solid var(--borda);
      border-radius: 10px;

      font-size: 22px;
      cursor: pointer;
    }

    .carrossel-controles button:hover {
      background: #e5d4ff;
    }

    .carrossel-contador {
      color: var(--suave);
      font-size: 14px;
      text-align: center;
    }

    .botao-ampliar {
      display: block;

      width: calc(100% - 28px);
      margin: 12px 14px;
      padding: 11px 14px;

      background: white;
      color: var(--roxo);

      border: 1px solid var(--borda);
      border-radius: 10px;

      font-weight: bold;
      cursor: pointer;
    }

    .botao-ampliar:hover {
      background: #e5d4ff;
    }

    /* ====================================
       INFORMAÇÕES DOS PRODUTOS
       ==================================== */

    .informacoes {
      padding: 20px;
    }

    .categoria {
      color: var(--roxo);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
    }

    h2 {
      margin: 8px 0 12px;
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    .descricao {
      margin: 0;
      color: var(--suave);
      font-size: 14px;

      /* Mantém as quebras de linha da descrição. */
      white-space: pre-line;

      overflow-wrap: anywhere;
    }

    .preco {
      margin: 20px 0 10px;
      color: var(--roxo);
      font-size: 24px;
      font-weight: bold;
    }

    .estoque {
      display: inline-block;
      padding: 5px 10px;

      background: #e9f8ef;
      color: #23623d;
      border-radius: 8px;

      font-size: 13px;
    }

    .estoque.esgotado {
      background: #fff0f0;
      color: #9b3434;
    }

    /* ====================================
       GALERIA AMPLIADA
       ==================================== */

    .modal-galeria {
      width: min(1000px, calc(100vw - 24px));
      max-width: none;

      /* Primeiro valor como alternativa ao dvh. */
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);

      padding: 0;
      overflow: auto;

      background: white;
      color: var(--texto);

      border: 1px solid var(--borda);
      border-radius: 18px;

      box-shadow: 0 20px 70px #00000050;
    }

    .modal-galeria::backdrop {
      background: rgba(15, 10, 25, 0.82);
    }

    .modal-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 16px 20px;
      border-bottom: 1px solid var(--borda);
    }

    .modal-cabecalho h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-fechar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;

      background: #f0e7ff;
      color: var(--roxo);

      border: 1px solid var(--borda);
      border-radius: 10px;

      font-size: 24px;
      cursor: pointer;
    }

    .modal-fechar:hover {
      background: #e5d4ff;
    }

    .modal-galeria .carrossel-tela {
      aspect-ratio: auto;

      height: min(68vh, 700px);
      height: min(68dvh, 700px);

      background: #171020;
    }

    .modal-galeria .carrossel-controles {
      background: white;
    }

    body.galeria-aberta {
      overflow: hidden;
    }

    /* ====================================
       RODAPÉ E AJUSTES PARA CELULAR
       ==================================== */

    footer {
      padding: 24px 20px;
      text-align: center;

      color: var(--suave);
      border-top: 1px solid var(--borda);

      font-size: 14px;
    }

    footer p {
      margin: 4px 0;
    }

    @media (max-width: 480px) {
      header {
        padding: 32px 16px;
      }

      .marca {
        flex-direction: column;
        gap: 18px;
      }

      .logo {
        width: 130px;
        height: 130px;
      }

      main {
        padding: 24px 16px 40px;
      }

      .filtros button {
        padding: 10px 14px;
        font-size: 14px;
      }

      .subcategorias button {
        padding: 8px 12px;
        font-size: 13px;
      }

      .modal-cabecalho {
        padding: 12px;
      }

      .modal-cabecalho h2 {
        font-size: 17px;
      }

      .modal-galeria .carrossel-tela {
        height: 60vh;
        height: 60dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .filtros button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <!-- ====================================
       CABEÇALHO DA LOJA
       ==================================== -->

  <header>
    <div class="marca">
      <div class="logo">
        <img
          src="imagens/logo.png"
          alt="Logo da Universo Pixelado"
        >
      </div>

      <div>
        <h1>Universo Pixelado</h1>

        <p class="subtitulo">
          Uma lojinha daora ⌚
        </p>
      </div>
    </div>

    <p class="apresentacao">
      Explore nosso catálogo e encontre seus favoritos!
      Confira fotos, vídeos, valores e disponibilidade.
    </p>
  </header>

  <main>
    <!-- CATEGORIAS PRINCIPAIS -->

    <nav
      id="categorias"
      class="filtros"
      aria-label="Categorias do catálogo"
    >
      <button
        type="button"
        data-categoria="todos"
        aria-pressed="true"
        aria-controls="catalogo"
      >
        ✨ Catálogo completo
      </button>

      <button
        type="button"
        data-categoria="Chaveiros"
        aria-pressed="false"
        aria-controls="catalogo"
      >
        🔑 Chaveiros
      </button>

      <button
        type="button"
        data-categoria="Adesivos"
        aria-pressed="false"
        aria-controls="catalogo"
      >
        🌈 Adesivos
      </button>

      <button
        type="button"
        data-categoria="Outros"
        aria-pressed="false"
        aria-controls="catalogo"
      >
        🎁 Outros
      </button>
    </nav>

    <!-- SUBCATEGORIAS DOS CHAVEIROS -->

    <nav
      id="subcategorias"
      class="subcategorias"
      aria-label="Subcategorias de chaveiros"
      hidden
    ></nav>

    <p
      id="resumo"
      class="resumo"
      role="status"
    ></p>

    <section
      id="catalogo"
      class="catalogo"
      aria-label="Produtos"
    ></section>

    <noscript>
      Ative o JavaScript do navegador para visualizar
      os produtos do catálogo.
    </noscript>
  </main>

  <footer>
    <p>Universo Pixelado ✦</p>
    <p>Catálogo de produtos — sem compras pelo site.</p>
  </footer>

  <!-- ====================================
       JANELA DA GALERIA AMPLIADA
       ==================================== -->

  <dialog
    id="modal-galeria"
    class="modal-galeria"
    aria-labelledby="modal-titulo"
  >
    <div class="modal-cabecalho">
      <h2 id="modal-titulo">
        Fotos e vídeos do produto
      </h2>

      <button
        id="modal-fechar"
        class="modal-fechar"
        type="button"
        aria-label="Fechar galeria"
        autofocus
      >
        ✕
      </button>
    </div>

    <div id="modal-conteudo"></div>
  </dialog>

  <script>
    /* ==========================================
       SUBCATEGORIAS DE CHAVEIROS

       Para adicionar outra subcategoria:
       1. Acrescente o nome nesta lista.
       2. Use o mesmo nome no produto.
       ========================================== */

    const subcategoriasChaveiros = [
      "Time de Futebol",
      "Pokémon",
      "Capa de Disco de Vinil"
    ];

    /* ==========================================
       CADASTRO DOS PRODUTOS

       categoria:
         "Chaveiros", "Adesivos" ou "Outros".

       subcategoria:
         Para chaveiros, use um nome da lista acima.

       descricao:
         Use crases para escrever em várias linhas.

       preco:
         Use ponto nos centavos: 15.00

       estoque:
         Quantidade disponível.
         Use 0 para mostrar "Esgotado".

       midias:
         Lista de fotos e vídeos.
         Use [] quando não tiver arquivos.

       tipo:
         "imagem" ou "video".

       arquivo:
         Caminho exato da imagem ou do vídeo.

       descricao da mídia:
         Texto opcional identificando a foto
         ou o vídeo.
       ========================================== */

    const produtos = [
      {
        nome: "Chaveiro Manchester City",
        categoria: "Chaveiros",
        subcategoria: "Time de Futebol",

        descricao: `⚽ Chaveiro Time de Futebol - Manchester City

🧵 MATERIAL: Acrílico transparente

📏 TAMANHO: 3,4cm de comprimento x 4cm de altura

🔎 ESPESSURA DO ACRÍLICO: 4mm

📦 QUANTIDADE: 1 chaveiro

📣 AVISO: Cada chaveiro pode apresentar leves alterações nos tons das cores, por se tratar de uma fabricação artesanal. ✨`,

        preco: 15.00,
        estoque: 1,
        emoji: "⚽",

        midias: [
          {
            tipo: "imagem",
            arquivo: "imagens/manchestercity1.jpeg"
          },
          {
            tipo: "imagem",
            arquivo: "imagens/manchestercity2.jpeg"
          },
          {
            tipo: "imagem",
            arquivo: "imagens/manchestercity3.jpeg"
          },
          {
            tipo: "video",
            arquivo: "videos/manchestercity.mp4"
          }
        ]
      },

      {
        nome: "Chaveiro Pikachu",
        categoria: "Chaveiros",
        subcategoria: "Pokémon",

        descricao: `⚡ Chaveiro Pikachu

📦 QUANTIDADE: 1 chaveiro

✨ Adicione aqui o material, as medidas e outras informações do seu produto.`,

        preco: 18.90,
        estoque: 5,
        emoji: "⚡",

        midias: []
      },

      {
        nome: "Chaveiro Capa de Disco",
        categoria: "Chaveiros",
        subcategoria: "Capa de Disco de Vinil",

        descricao: `🎵 Chaveiro inspirado em capa de disco de vinil

📦 QUANTIDADE: 1 chaveiro

✨ Adicione aqui o nome do álbum e os detalhes do produto.`,

        preco: 20.00,
        estoque: 4,
        emoji: "🎵",

        midias: []
      },

      {
        nome: "Adesivo Planeta",
        categoria: "Adesivos",

        descricao: `🪐 Um toque de universo para seu caderno!

📦 QUANTIDADE: 1 adesivo

✨ Personalize seus objetos com um detalhe especial.`,

        preco: 5.00,
        estoque: 20,
        emoji: "🪐",

        midias: [
          {
            tipo: "imagem",
            arquivo: "imagens/adesivo-planeta.jpg",
            descricao: "Adesivo ilustrado de um planeta"
          }
        ]
      },

      {
        nome: "Marcador de Página",
        categoria: "Outros",

        descricao: `📚 Para acompanhar suas aventuras literárias!

📦 QUANTIDADE: 1 marcador de página

✨ Fotos em breve.`,

        preco: 8.00,
        estoque: 0,
        emoji: "📚",

        midias: []
      }
    ];

    /* ==========================================
       FUNCIONAMENTO DO SITE

       Para cadastrar produtos, não precisa
       alterar o código daqui para baixo.
       ========================================== */

    const catalogo = document.querySelector("#catalogo");
    const resumo = document.querySelector("#resumo");

    const botoesCategorias = document.querySelectorAll(
      "#categorias [data-categoria]"
    );

    const areaSubcategorias = document.querySelector(
      "#subcategorias"
    );

    const modalGaleria = document.querySelector(
      "#modal-galeria"
    );

    const modalTitulo = document.querySelector(
      "#modal-titulo"
    );

    const modalConteudo = document.querySelector(
      "#modal-conteudo"
    );

    const modalFechar = document.querySelector(
      "#modal-fechar"
    );

    let categoriaAtual = "todos";
    let subcategoriaAtual = "todos";
    let elementoQueAbriuGaleria = null;

    const moeda = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

    /* CRIA ELEMENTOS HTML */

    function criarElemento(tag, classe, texto) {
      const elemento = document.createElement(tag);

      if (classe) {
        elemento.className = classe;
      }

      if (texto !== undefined) {
        elemento.textContent = texto;
      }

      return elemento;
    }

    /* MENSAGEM PARA PRODUTOS SEM MÍDIA */

    function criarPlaceholder(produto, mensagem) {
      const placeholder = criarElemento(
        "div",
        "sem-midia"
      );

      const emoji = criarElemento(
        "span",
        "sem-midia-emoji",
        produto.emoji || "✨"
      );

      emoji.setAttribute("aria-hidden", "true");

      const texto = criarElemento(
        "p",
        "sem-midia-texto",
        mensagem
      );

      placeholder.append(emoji, texto);

      return placeholder;
    }

    /* ==========================================
       ABRIR E FECHAR A GALERIA AMPLIADA
       ========================================== */

    function abrirGaleria(
      produto,
      indiceInicial = 0,
      elementoOrigem = null
    ) {
      if (modalGaleria.open) {
        return;
      }

      // Pausa vídeos que estejam tocando nos cards.
      catalogo.querySelectorAll("video").forEach(video => {
        video.pause();
      });

      elementoQueAbriuGaleria =
        elementoOrigem || document.activeElement;

      modalTitulo.textContent = produto.nome;

      modalConteudo.replaceChildren(
        criarCarrossel(produto, false, indiceInicial)
      );

      modalGaleria.showModal();

      document.body.classList.add("galeria-aberta");
    }

    function fecharGaleria() {
      if (modalGaleria.open) {
        modalGaleria.close();
      }
    }

    modalFechar.addEventListener(
      "click",
      fecharGaleria
    );

    // Fecha ao clicar fora dos limites da janela.
    modalGaleria.addEventListener("click", evento => {
      if (evento.target !== modalGaleria) {
        return;
      }

      const limites = modalGaleria.getBoundingClientRect();

      const clicouFora =
        evento.clientX < limites.left ||
        evento.clientX > limites.right ||
        evento.clientY < limites.top ||
        evento.clientY > limites.bottom;

      if (clicouFora) {
        fecharGaleria();
      }
    });

    // Também executado quando a janela fecha com Escape.
    modalGaleria.addEventListener("close", () => {
      modalConteudo.querySelectorAll("video").forEach(video => {
        video.pause();
      });

      modalConteudo.replaceChildren();

      document.body.classList.remove("galeria-aberta");

      if (
        elementoQueAbriuGaleria &&
        elementoQueAbriuGaleria.isConnected
      ) {
        elementoQueAbriuGaleria.focus({
          preventScroll: true
        });
      }

      elementoQueAbriuGaleria = null;
    });

    /* ==========================================
       CARROSSEL DE CADA PRODUTO
       ========================================== */

    function criarCarrossel(
      produto,
      permitirAmpliacao = true,
      indiceInicial = 0
    ) {
      const carrossel = criarElemento(
        "div",
        "carrossel"
      );

      const tela = criarElemento(
        "div",
        "carrossel-tela"
      );

      carrossel.setAttribute("role", "group");

      carrossel.setAttribute(
        "aria-label",
        `Fotos e vídeos de ${produto.nome}`
      );

      const midias = produto.midias || [];

      let indice = midias.length
        ? Math.max(
            0,
            Math.min(indiceInicial, midias.length - 1)
          )
        : 0;

      let botaoAmpliar = null;

      const contador = criarElemento(
        "span",
        "carrossel-contador"
      );

      contador.setAttribute("role", "status");
      contador.setAttribute("aria-atomic", "true");

      function mostrarMidia() {
        const videoAnterior = tela.querySelector("video");

        if (videoAnterior) {
          videoAnterior.pause();
        }

        tela.replaceChildren();

        if (midias.length === 0) {
          tela.append(
            criarPlaceholder(
              produto,
              "Fotos em breve ✨"
            )
          );

          return;
        }

        const midia = midias[indice];
        let elemento;

        if (midia.tipo === "video") {
          elemento = criarElemento("video");

          elemento.controls = true;
          elemento.preload = permitirAmpliacao
            ? "none"
            : "metadata";

          elemento.playsInline = true;

          elemento.setAttribute(
            "aria-label",
            midia.descricao || `Vídeo de ${produto.nome}`
          );

          elemento.textContent =
            "Seu navegador não suporta este vídeo.";
        } else {
          elemento = criarElemento("img");

          elemento.alt =
            midia.descricao ||
            `Foto ${indice + 1} de ${produto.nome}`;

          elemento.loading = permitirAmpliacao
            ? "lazy"
            : "eager";

          elemento.decoding = "async";

          if (permitirAmpliacao) {
            elemento.classList.add("foto-ampliavel");

            elemento.title = "Clique para ampliar";

            elemento.addEventListener("click", () => {
              abrirGaleria(
                produto,
                indice,
                botaoAmpliar
              );
            });
          }
        }

        elemento.addEventListener(
          "error",
          () => {
            // Não altera uma mídia que já foi trocada.
            if (elemento.parentNode !== tela) {
              return;
            }

            tela.replaceChildren(
              criarPlaceholder(
                produto,
                "Não foi possível carregar esta mídia."
              )
            );
          },
          { once: true }
        );

        tela.append(elemento);
        elemento.src = midia.arquivo;

        const tipo =
          midia.tipo === "video" ? "Vídeo" : "Foto";

        contador.textContent =
          `${indice + 1} de ${midias.length} · ${tipo}`;
      }

      carrossel.append(tela);

      if (midias.length > 1) {
        const controles = criarElemento(
          "div",
          "carrossel-controles"
        );

        const anterior = criarElemento(
          "button",
          "",
          "❮"
        );

        anterior.type = "button";

        anterior.setAttribute(
          "aria-label",
          `Mídia anterior de ${produto.nome}`
        );

        const proximo = criarElemento(
          "button",
          "",
          "❯"
        );

        proximo.type = "button";

        proximo.setAttribute(
          "aria-label",
          `Próxima mídia de ${produto.nome}`
        );

        anterior.addEventListener("click", () => {
          indice =
            (indice - 1 + midias.length) % midias.length;

          mostrarMidia();
        });

        proximo.addEventListener("click", () => {
          indice = (indice + 1) % midias.length;

          mostrarMidia();
        });

        controles.append(
          anterior,
          contador,
          proximo
        );

        carrossel.append(controles);
      }

      // Só mostra o botão de ampliação nos cards.
      if (permitirAmpliacao && midias.length > 0) {
        botaoAmpliar = criarElemento(
          "button",
          "botao-ampliar",
          "🔍 Ampliar fotos e vídeos"
        );

        botaoAmpliar.type = "button";

        botaoAmpliar.setAttribute(
          "aria-label",
          `Ampliar fotos e vídeos de ${produto.nome}`
        );

        botaoAmpliar.setAttribute(
          "aria-haspopup",
          "dialog"
        );

        botaoAmpliar.setAttribute(
          "aria-controls",
          "modal-galeria"
        );

        botaoAmpliar.addEventListener("click", () => {
          abrirGaleria(
            produto,
            indice,
            botaoAmpliar
          );
        });

        carrossel.append(botaoAmpliar);
      }

      mostrarMidia();

      return carrossel;
    }

    /* ==========================================
       ATUALIZA OS FILTROS
       ========================================== */

    function atualizarFiltros() {
      botoesCategorias.forEach(botao => {
        botao.setAttribute(
          "aria-pressed",
          String(
            botao.dataset.categoria === categoriaAtual
          )
        );
      });

      areaSubcategorias.hidden =
        categoriaAtual !== "Chaveiros";

      areaSubcategorias
        .querySelectorAll("button")
        .forEach(botao => {
          botao.setAttribute(
            "aria-pressed",
            String(
              botao.dataset.subcategoria === subcategoriaAtual
            )
          );
        });
    }

    /* ==========================================
       CRIA OS BOTÕES DAS SUBCATEGORIAS
       ========================================== */

    function criarBotoesSubcategorias() {
      areaSubcategorias.replaceChildren();

      const opcoes = [
        {
          valor: "todos",
          texto: "Todos os chaveiros"
        },

        ...subcategoriasChaveiros.map(nome => ({
          valor: nome,
          texto: nome
        }))
      ];

      opcoes.forEach(opcao => {
        const botao = criarElemento(
          "button",
          "",
          opcao.texto
        );

        botao.type = "button";
        botao.dataset.subcategoria = opcao.valor;

        botao.setAttribute(
          "aria-controls",
          "catalogo"
        );

        botao.setAttribute(
          "aria-pressed",
          String(subcategoriaAtual === opcao.valor)
        );

        botao.addEventListener("click", () => {
          subcategoriaAtual = opcao.valor;

          atualizarFiltros();
          mostrarProdutos();
        });

        areaSubcategorias.append(botao);
      });
    }

    /* ==========================================
       FILTRA E EXIBE OS PRODUTOS
       ========================================== */

    function mostrarProdutos() {
      catalogo.querySelectorAll("video").forEach(video => {
        video.pause();
      });

      catalogo.replaceChildren();

      const lista = produtos.filter(produto => {
        const correspondeCategoria =
          categoriaAtual === "todos" ||
          produto.categoria === categoriaAtual;

        const correspondeSubcategoria =
          categoriaAtual !== "Chaveiros" ||
          subcategoriaAtual === "todos" ||
          produto.subcategoria === subcategoriaAtual;

        return (
          correspondeCategoria &&
          correspondeSubcategoria
        );
      });

      let nomeFiltro =
        categoriaAtual === "todos"
          ? "Todas as categorias"
          : categoriaAtual;

      if (
        categoriaAtual === "Chaveiros" &&
        subcategoriaAtual !== "todos"
      ) {
        nomeFiltro += ` / ${subcategoriaAtual}`;
      }

      if (lista.length === 0) {
        resumo.textContent =
          `Nenhum produto cadastrado neste filtro: ${nomeFiltro}.`;

        return;
      }

      const palavraProduto =
        lista.length === 1 ? "produto" : "produtos";

      resumo.textContent =
        `${lista.length} ${palavraProduto} · ${nomeFiltro}`;

      lista.forEach(produto => {
        const card = criarElemento(
          "article",
          "produto"
        );

        card.append(criarCarrossel(produto));

        const info = criarElemento(
          "div",
          "informacoes"
        );

        const categoriaExibida = produto.subcategoria
          ? `${produto.categoria} · ${produto.subcategoria}`
          : produto.categoria;

        info.append(
          criarElemento(
            "span",
            "categoria",
            categoriaExibida
          ),

          criarElemento(
            "h2",
            "",
            produto.nome
          ),

          criarElemento(
            "p",
            "descricao",
            produto.descricao
          ),

          criarElemento(
            "p",
            "preco",
            moeda.format(produto.preco)
          )
        );

        const disponivel = produto.estoque > 0;
        let textoEstoque = "Esgotado";

        if (disponivel) {
          textoEstoque =
            produto.estoque === 1
              ? "1 unidade disponível"
              : `${produto.estoque} unidades disponíveis`;
        }

        info.append(
          criarElemento(
            "span",
            disponivel
              ? "estoque"
              : "estoque esgotado",
            textoEstoque
          )
        );

        card.append(info);
        catalogo.append(card);
      });
    }

    /* ==========================================
       CLIQUES NAS CATEGORIAS PRINCIPAIS
       ========================================== */

    botoesCategorias.forEach(botao => {
      botao.addEventListener("click", () => {
        categoriaAtual = botao.dataset.categoria;

        // Limpa o subfiltro ao mudar de categoria.
        subcategoriaAtual = "todos";

        atualizarFiltros();
        mostrarProdutos();
      });
    });

    /* ==========================================
       INICIALIZAÇÃO
       ========================================== */

    criarBotoesSubcategorias();
    atualizarFiltros();
    mostrarProdutos();
  </script>
</body>
</html>
