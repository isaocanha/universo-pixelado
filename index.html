<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Conheça o catálogo da Universo Pixelado: cópia, digitalização, chaveiros, adesivos, bottons e papelaria."
  >

  <title>Universo Pixelado | Catálogo</title>

  <style>
    :root {
      --fundo: #faf7ff;
      --texto: #302448;
      --suave: #756885;
      --roxo: #7544c6;
      --borda: #e9def5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid #c62e7a;
      outline-offset: 4px;
    }

    [hidden] {
      display: none !important;
    }

    /* CABEÇALHO */

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;

      background-color: #e5d4ff;
      background-image:
        linear-gradient(
          rgba(250, 247, 255, 0.12),
          rgba(250, 247, 255, 0.12)
        ),
        url("imagens/cabeçalho.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-bottom: 3px solid var(--borda);
    }

    .logo {
      width: 240px;
      max-width: 100%;
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    main {
      width: min(1100px, 100%);
      margin: auto;
      padding: 32px 20px 48px;
    }

    /* CATEGORIAS */

    .filtros,
    .subcategorias {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .filtros button {
      padding: 12px 20px;
      background: white;
      color: var(--roxo);
      border: 2px solid var(--borda);
      border-radius: 12px;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .filtros button:hover {
      background: #f0e7ff;
      transform: translateY(-2px);
    }

    .filtros button[aria-pressed="true"] {
      background: var(--roxo);
      border-color: var(--roxo);
      color: white;
    }

    .subcategorias {
      gap: 8px;
      margin-top: -8px;
    }

    .subcategorias button {
      padding: 10px 15px;
      background: white;
      color: var(--roxo);
      border: 1px solid var(--borda);
      border-radius: 20px;
      font-size: 14px;
    }

    .subcategorias button:hover {
      background: #f0e7ff;
    }

    .subcategorias button[aria-pressed="true"] {
      background: #e5d4ff;
      color: var(--texto);
      border-color: var(--roxo);
      font-weight: bold;
    }

    /* FORMA DE PAGAMENTO */

    .pagamento {
      max-width: 650px;
      margin: 0 auto 26px;
      padding: 20px;
      background: white;
      border: 1px solid var(--borda);
      border-radius: 16px;
      text-align: center;
    }

    .pagamento label {
      display: block;
      margin-bottom: 12px;
      color: var(--roxo);
      font-weight: bold;
      font-size: 18px;
    }

    .pagamento select {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px;
      background: var(--fundo);
      color: var(--texto);
      border: 2px solid var(--borda);
      border-radius: 10px;
    }

    /* MENSAGEM ABAIXO DA SELEÇÃO DE PAGAMENTO */

    .pagamento-aviso {
      margin: 14px 0 0;
      color: var(--suave);
      font-size: 13px;
      line-height: 1.6;
    }

    /* CATÁLOGO */

    .resumo {
      margin: 0 0 24px;
      text-align: center;
      color: var(--suave);
      font-size: 14px;
    }

    .catalogo {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      gap: 24px;
      align-items: start;
    }

    .produto {
      min-width: 0;
      overflow: hidden;
      background: white;
      border: 1px solid var(--borda);
      border-radius: 18px;
      box-shadow: 0 6px 20px #30244808;
    }

    /* CARROSSEL */

    .carrossel {
      background: #f4edff;
    }

    .carrossel-tela {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
    }

    .carrossel-tela > img,
    .carrossel-tela > video,
    .carrossel-tela > .sem-midia {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: contain;
    }

    .carrossel-tela > video {
      background: #171020;
    }

    .carrossel-tela > .sem-midia {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: linear-gradient(135deg, #f0e5ff, #ffeaf3);
    }

    .sem-midia-emoji {
      font-size: 64px;
    }

    .sem-midia-texto {
      max-width: 240px;
      margin: 0;
      color: var(--suave);
      font-size: 14px;
    }

    .foto-ampliavel {
      cursor: zoom-in;
    }

    .carrossel-controles {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-top: 1px solid var(--borda);
    }

    .carrossel-controles button {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: white;
      color: var(--roxo);
      border: 1px solid var(--borda);
      border-radius: 10px;
      font-size: 22px;
    }

    .carrossel-controles button:hover {
      background: #e5d4ff;
    }

    .carrossel-contador {
      color: var(--suave);
      font-size: 14px;
      text-align: center;
    }

    .botao-ampliar {
      display: block;
      width: calc(100% - 28px);
      margin: 12px 14px;
      padding: 11px 14px;
      background: white;
      color: var(--roxo);
      border: 1px solid var(--borda);
      border-radius: 10px;
      font-weight: bold;
    }

    .botao-ampliar:hover {
      background: #e5d4ff;
    }

    /* INFORMAÇÕES E PREÇOS */

    .informacoes {
      padding: 20px;
    }

    .categoria {
      color: var(--roxo);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
    }

    h2 {
      margin: 8px 0 12px;
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    .descricao {
      margin: 0;
      color: var(--suave);
      font-size: 14px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .preco {
      margin: 20px 0 4px;
      color: var(--roxo);
      font-size: 28px;
      font-weight: bold;
    }

    .preco-forma {
      margin: 0 0 12px;
      color: var(--suave);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .preco-detalhe.desconto {
      display: inline-block;
      margin: 0 0 14px;
      padding: 5px 9px;
      background: #000000;
      color: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    /* DISPONIBILIDADE: SEM QUANTIDADE DE ESTOQUE */

    .disponibilidade {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .disponibilidade.disponivel {
      background: #e9f8ef;
      color: #23623d;
    }

    .disponibilidade.esgotado {
      background: #fff0f0;
      color: #9b3434;
    }

    .disponibilidade.encomenda {
      background: #fff5df;
      color: #805b12;
    }

     /* SELETOR DE VARIAÇÕES DO PRODUTO */
    
    .variacao-produto {
      margin-top: 18px;
    }
    
    .variacao-produto label {
      display: block;
      margin-bottom: 8px;
      color: var(--roxo);
      font-size: 14px;
      font-weight: bold;
    }
    
    .variacao-produto select {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px;
      background: var(--fundo);
      color: var(--texto);
      border: 2px solid var(--borda);
      border-radius: 10px;
      font-size: 16px;
    }   

    /* GALERIA AMPLIADA */

    .modal-galeria {
      width: min(1000px, calc(100vw - 24px));
      max-width: none;
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      padding: 0;
      overflow: auto;
      background: white;
      color: var(--texto);
      border: 1px solid var(--borda);
      border-radius: 18px;
      box-shadow: 0 20px 70px #00000050;
    }

    .modal-galeria::backdrop {
      background: rgba(15, 10, 25, 0.82);
    }

    .modal-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--borda);
    }

    .modal-cabecalho h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-fechar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: #f0e7ff;
      color: var(--roxo);
      border: 1px solid var(--borda);
      border-radius: 10px;
      font-size: 24px;
    }

    .modal-fechar:hover {
      background: #e5d4ff;
    }

    .modal-galeria .carrossel-tela {
      aspect-ratio: auto;
      height: min(68vh, 700px);
      height: min(68dvh, 700px);
      background: #171020;
    }

    .modal-galeria .carrossel-controles {
      background: white;
    }

    body.galeria-aberta {
      overflow: hidden;
    }

    /* RODAPÉ */

    footer {
      padding: 24px 20px;
      text-align: center;
      color: var(--suave);
      border-top: 1px solid var(--borda);
      font-size: 14px;
    }

    footer p {
      margin: 6px 0;
    }

    /* CELULAR */

    @media (max-width: 600px) {
      header {
        padding: 28px 16px;
      }

      .logo {
        width: 190px;
      }

      main {
        padding: 24px 16px 40px;
      }

      .filtros button {
        padding: 10px 14px;
        font-size: 14px;
      }

      .subcategorias button {
        padding: 9px 12px;
        font-size: 13px;
      }

      .pagamento {
        padding: 16px;
      }

      .pagamento label {
        font-size: 16px;
      }

      .pagamento select {
        font-size: 16px;
      }

      .modal-cabecalho {
        padding: 12px;
      }

      .modal-cabecalho h2 {
        font-size: 17px;
      }

      .modal-galeria .carrossel-tela {
        height: 60vh;
        height: 60dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .filtros button {
        transition: none;
      }
    }
  </style>
</head>

    </nav>

      aria-label="Subcategorias do catálogo"

    <!-- FORMA DE PAGAMENTO E AVISO -->

        💳 Escolha a forma de pagamento

        id="forma-pagamento"
        aria-describedby="pagamento-aviso"

        <option value="pix" selected>
          PIX / Dinheiro (5% de desconto)
        </option>

        <option value="cartao">
          Cartão (apenas aproximação) / Link de Pagamento (débito e crédito)
        </option>
      </select>

      <p
        id="pagamento-aviso"
        class="pagamento-aviso"
      >
        Esta seleção apenas calcula os valores do catálogo.
        <br>
        Não realiza pagamento nem reserva produtos.
      </p>
    </div>

    <p
      id="resumo"
      class="resumo"
      role="status"
    ></p>

    <section
      id="catalogo"
      class="catalogo"
      aria-label="Produtos e serviços"
    ></section>

    <noscript>
      Ative o JavaScript do navegador para visualizar
      o catálogo e calcular os valores.
    </noscript>
  </main>

  <footer>
    <p>✦ Universo Pixelado, Suzano, SP ✦</p>

    ];

    /* FORMAS DE PAGAMENTO */

    const formasPagamento = {
      pix: {
        nome: "PIX / Dinheiro",
        acrescimoPercentual: 0
      },

      cartao: {
        nome: "Cartão (apenas aproximação) / Link de Pagamento (débito e crédito)",
        acrescimoPercentual: 5
      }
    };

    /* STATUS DE DISPONIBILIDADE */

    const statusDisponibilidade = {
      disponivel: {
        texto: "Disponível",
        classe: "disponivel"
      },

      esgotado: {
        texto: "Esgotado",
        classe: "esgotado"
      },

      encomenda: {
        texto: "Encomenda",
        classe: "encomenda"
      }
    };

    /* ELEMENTOS DO SITE */

    const catalogo = document.querySelector("#catalogo");
    const resumo = document.querySelector("#resumo");

    const botoesCategorias = document.querySelectorAll(
      "#categorias [data-categoria]"
    );

    const areaSubcategorias = document.querySelector(
      "#subcategorias"
    );

    const seletorPagamento = document.querySelector(
      "#forma-pagamento"
    );

    const modalGaleria = document.querySelector("#modal-galeria");
    const modalTitulo = document.querySelector("#modal-titulo");
    const modalConteudo = document.querySelector("#modal-conteudo");
    const modalFechar = document.querySelector("#modal-fechar");

    let categoriaAtual = "todos";
    let subcategoriaAtual = "todos";
    let elementoQueAbriuGaleria = null;

    // Guarda referências aos preços dos cards visíveis.
    // Trocar o pagamento não reinicia os carrosséis.
    let precosVisiveis = [];

    const moeda = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

    /* CRIAÇÃO DE ELEMENTOS */

    function criarElemento(tag, classe, texto) {
      const elemento = document.createElement(tag);

      if (classe) {
        elemento.className = classe;
      }

      if (texto !== undefined) {
        elemento.textContent = texto;
      }

      return elemento;
    }

    /* VALIDA A FORMA DE PAGAMENTO */

    function obterPagamentoAtual() {
      const valor = seletorPagamento.value;

      if (
        Object.prototype.hasOwnProperty.call(
          formasPagamento,
          valor
        )
      ) {
        return valor;
      }

      seletorPagamento.value = "pix";
      return "pix";
    }

    /* CÁLCULO DO PREÇO FINAL */

    function calcularPrecoFinal(precoOriginal, pagamento) {
      const originalCentavos = Math.round(precoOriginal * 100);

      const percentual =
        formasPagamento[pagamento].acrescimoPercentual;

      const finalCentavos = Math.round(
        originalCentavos * (100 + percentual) / 100
      );

      return finalCentavos / 100;
    }

    function atualizarPrecos() {
      const pagamento = obterPagamentoAtual();
      const forma = formasPagamento[pagamento];
    
      precosVisiveis.forEach(item => {
        // Usa o preço original da variação selecionada
        // ou o preço original do produto sem variações.
        const precoFinal = calcularPrecoFinal(
          item.precoOriginal,
          pagamento
        );
    
        item.preco.textContent = moeda.format(precoFinal);
    
        const textoVariacao = item.variacaoSelecionada
          ? ` • ${item.variacaoSelecionada}`
          : "";
    
        item.forma.textContent =
          `Por unidade${textoVariacao} • ${forma.nome}`;
    
        item.desconto.hidden = pagamento !== "pix";
      });
    }
      
    seletorPagamento.addEventListener(
      "change",
      atualizarPrecos
    );

    /* DISPONIBILIDADE DO PRODUTO */

    function obterDisponibilidade(produto) {
      // Aceita "Disponível" e "Disponivel",
      // além de variações entre maiúsculas e minúsculas.
      const valor = String(produto.disponibilidade || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

      if (
        Object.prototype.hasOwnProperty.call(
          statusDisponibilidade,
          valor
        )
      ) {
        return statusDisponibilidade[valor];
      }

      // Um status ausente ou inválido não será
      // anunciado como disponível por engano.
      console.warn(
        `Disponibilidade inválida para "${produto.nome}". ` +
        'Use "Disponível", "Esgotado" ou "Encomenda".'
      );

      return statusDisponibilidade.esgotado;
    }

    /* ITENS SEM MÍDIA */

    function criarPlaceholder(produto, mensagem = "") {
      const placeholder = criarElemento("div", "sem-midia");

      const emoji = criarElemento(
        "span",
        "sem-midia-emoji",
        produto.emoji || "✨"
      );

      emoji.setAttribute("aria-hidden", "true");
      placeholder.append(emoji);

      if (mensagem) {
        placeholder.append(
          criarElemento("p", "sem-midia-texto", mensagem)
        );
      }

      return placeholder;
    }

    /* GALERIA AMPLIADA */

    function abrirGaleria(
      produto,
      indiceInicial = 0,
      elementoOrigem = null
    ) {
      if (modalGaleria.open) {
        return;
      }

      catalogo.querySelectorAll("video").forEach(video => {
        video.pause();
      });

      elementoQueAbriuGaleria =
        elementoOrigem || document.activeElement;

      modalTitulo.textContent = produto.nome;

      modalConteudo.replaceChildren(
        criarCarrossel(produto, false, indiceInicial)
      );

      modalGaleria.showModal();
      document.body.classList.add("galeria-aberta");
    }

    function fecharGaleria() {
      if (modalGaleria.open) {
        modalGaleria.close();
      }
    }

    modalFechar.addEventListener("click", fecharGaleria);

    modalGaleria.addEventListener("click", evento => {
      if (evento.target !== modalGaleria) {
        return;
      }

      const limites = modalGaleria.getBoundingClientRect();

      const clicouFora =
        evento.clientX < limites.left ||
        evento.clientX > limites.right ||
        evento.clientY < limites.top ||
        evento.clientY > limites.bottom;

      if (clicouFora) {
        fecharGaleria();
      }
    });

    // Também executado ao fechar com Escape.
    modalGaleria.addEventListener("close", () => {
      modalConteudo.querySelectorAll("video").forEach(video => {
        video.pause();
      });

      modalConteudo.replaceChildren();
      document.body.classList.remove("galeria-aberta");

      if (
        elementoQueAbriuGaleria &&
        elementoQueAbriuGaleria.isConnected
      ) {
        elementoQueAbriuGaleria.focus({
          preventScroll: true
        });
      }

      elementoQueAbriuGaleria = null;
    });

    /* CARROSSEL */

    function criarCarrossel(
      produto,
      permitirAmpliacao = true,
      indiceInicial = 0
    ) {
      const carrossel = criarElemento("div", "carrossel");
      const tela = criarElemento("div", "carrossel-tela");

      carrossel.setAttribute("role", "group");

      carrossel.setAttribute(
        "aria-label",
        `Fotos e vídeos de ${produto.nome}`
      );

      const midias = produto.midias || [];

      let indice = midias.length
        ? Math.max(0, Math.min(indiceInicial, midias.length - 1))
        : 0;

      let botaoAmpliar = null;

      const contador = criarElemento(
        "span",
        "carrossel-contador"
      );

      contador.setAttribute("role", "status");
      contador.setAttribute("aria-atomic", "true");

      function mostrarMidia() {
        const videoAnterior = tela.querySelector("video");

        if (videoAnterior) {
          videoAnterior.pause();
        }

        tela.replaceChildren();

        if (midias.length === 0) {
          tela.append(criarPlaceholder(produto));
          return;
        }

        const midia = midias[indice];
        let elemento;

        if (midia.tipo === "video") {
          elemento = criarElemento("video");
          elemento.controls = true;
          elemento.preload = permitirAmpliacao
            ? "none"
            : "metadata";
          elemento.playsInline = true;

          elemento.setAttribute(
            "aria-label",
            midia.descricao || `Vídeo de ${produto.nome}`
          );

          elemento.textContent =
            "Seu navegador não suporta este vídeo.";
        } else {
          elemento = criarElemento("img");

          elemento.alt =
            midia.descricao ||
            `Foto ${indice + 1} de ${produto.nome}`;

          elemento.loading = permitirAmpliacao
            ? "lazy"
            : "eager";

          elemento.decoding = "async";

          if (permitirAmpliacao) {
            elemento.classList.add("foto-ampliavel");
            elemento.title = "Clique para ampliar";

            elemento.addEventListener("click", () => {
              abrirGaleria(produto, indice, botaoAmpliar);
            });
          }
        }

        elemento.addEventListener(
          "error",
          () => {
            if (elemento.parentNode !== tela) {
              return;
            }

            tela.replaceChildren(
              criarPlaceholder(
                produto,
                "Não foi possível carregar esta mídia."
              )
            );
          },
          { once: true }
        );

        tela.append(elemento);
        elemento.src = midia.arquivo;

        contador.textContent =
          `${indice + 1} de ${midias.length} · ${
            midia.tipo === "video" ? "Vídeo" : "Foto"
          }`;
      }

      carrossel.append(tela);

      if (midias.length > 1) {
        const controles = criarElemento(
          "div",
          "carrossel-controles"
        );

        const anterior = criarElemento("button", "", "❮");
        anterior.type = "button";

        anterior.setAttribute(
          "aria-label",
          `Mídia anterior de ${produto.nome}`
        );

        const proximo = criarElemento("button", "", "❯");
        proximo.type = "button";

        proximo.setAttribute(
          "aria-label",
          `Próxima mídia de ${produto.nome}`
        );

        anterior.addEventListener("click", () => {
          indice = (indice - 1 + midias.length) % midias.length;
          mostrarMidia();
        });

        proximo.addEventListener("click", () => {
          indice = (indice + 1) % midias.length;
          mostrarMidia();
        });

        controles.append(anterior, contador, proximo);
        carrossel.append(controles);
      }

      if (permitirAmpliacao && midias.length > 0) {
        botaoAmpliar = criarElemento(
          "button",
          "botao-ampliar",
          "🔍 Ampliar fotos e vídeos"
        );

        botaoAmpliar.type = "button";

        botaoAmpliar.setAttribute(
          "aria-label",
          `Ampliar fotos e vídeos de ${produto.nome}`
        );

        botaoAmpliar.setAttribute("aria-haspopup", "dialog");
        botaoAmpliar.setAttribute(
          "aria-controls",
          "modal-galeria"
        );

        botaoAmpliar.addEventListener("click", () => {
          abrirGaleria(produto, indice, botaoAmpliar);
        });

        carrossel.append(botaoAmpliar);
      }

      mostrarMidia();

      return carrossel;
    }

    /* ESTADO DOS FILTROS */

    function atualizarFiltros() {
      botoesCategorias.forEach(botao => {
        botao.setAttribute(
          "aria-pressed",
          String(botao.dataset.categoria === categoriaAtual)
        );
      });

      areaSubcategorias.querySelectorAll("button").forEach(
        botao => {
          botao.setAttribute(
            "aria-pressed",
            String(
              botao.dataset.subcategoria === subcategoriaAtual
            )
          );
        }
      );
    }

    /* SUBCATEGORIAS */

    function criarBotoesSubcategorias() {
      areaSubcategorias.replaceChildren();

      const lista =
        subcategoriasPorCategoria[categoriaAtual] || [];

      areaSubcategorias.hidden = lista.length === 0;

      if (lista.length === 0) {
        return;
      }

      areaSubcategorias.setAttribute(
        "aria-label",
        `Subcategorias de ${categoriaAtual}`
      );

      const opcoes = [
        {
          valor: "todos",
          texto: "Todos os chaveiros"
        },

        ...lista.map(nome => ({
          valor: nome,
          texto: nome
        }))
      ];

      opcoes.forEach(opcao => {
        const botao = criarElemento(
          "button",
          "",
          opcao.texto
        );

        botao.type = "button";
        botao.dataset.subcategoria = opcao.valor;

        botao.setAttribute("aria-controls", "catalogo");

        botao.setAttribute(
          "aria-pressed",
          String(subcategoriaAtual === opcao.valor)
        );

        botao.addEventListener("click", () => {
          subcategoriaAtual = opcao.valor;
          atualizarFiltros();
          mostrarProdutos();
        });

        areaSubcategorias.append(botao);
      });
    }

    /* EXIBIÇÃO DOS PRODUTOS */

    function mostrarProdutos() {
      catalogo.querySelectorAll("video").forEach(video => {
        video.pause();
      });
    
      catalogo.replaceChildren();
      precosVisiveis = [];
    
      const lista = produtos.filter(produto => {
        const correspondeCategoria =
          categoriaAtual === "todos" ||
          produto.categoria === categoriaAtual;
    
        const correspondeSubcategoria =
          subcategoriaAtual === "todos" ||
          produto.subcategoria === subcategoriaAtual;
    
        return correspondeCategoria && correspondeSubcategoria;
      });
    
      let nomeFiltro =
        categoriaAtual === "todos"
          ? "Todas as categorias"
          : categoriaAtual;
    
      if (subcategoriaAtual !== "todos") {
        nomeFiltro += ` / ${subcategoriaAtual}`;
      }
    
      if (lista.length === 0) {
        resumo.textContent =
          `Nenhum item cadastrado neste filtro: ${nomeFiltro}.`;
    
        return;
      }
    
      resumo.textContent =
        `${lista.length} ${
          lista.length === 1 ? "item" : "itens"
        } · ${nomeFiltro}`;
    
      lista.forEach((produto, indiceProduto) => {
        const card = criarElemento("article", "produto");
    
        card.append(criarCarrossel(produto));
    
        const info = criarElemento("div", "informacoes");
    
        const categoriaExibida = produto.subcategoria
          ? `${produto.categoria} · ${produto.subcategoria}`
          : produto.categoria;
    
        info.append(
          criarElemento("span", "categoria", categoriaExibida),
          criarElemento("h2", "", produto.nome),
          criarElemento("p", "descricao", produto.descricao)
        );
    
        const variacoes = Array.isArray(produto.variacoes)
          ? produto.variacoes
          : [];
    
        const temVariacoes = variacoes.length > 0;
    
        const preco = criarElemento("p", "preco");
        const forma = criarElemento("p", "preco-forma");
    
        // Anuncia o novo preço ao alterar a variação.
        preco.setAttribute("aria-live", "polite");
        preco.setAttribute("aria-atomic", "true");
    
        const desconto = criarElemento(
          "span",
          "preco-detalhe desconto",
          "(5% de desconto)"
        );
    
        desconto.hidden = obterPagamentoAtual() !== "pix";
    
        // A primeira variação fica selecionada inicialmente.
        const referenciaPreco = {
          produto,
          preco,
          forma,
          desconto,
    
          precoOriginal: temVariacoes
            ? variacoes[0].preco
            : produto.preco,
    
          variacaoSelecionada: temVariacoes
            ? variacoes[0].nome
            : ""
        };
    
        precosVisiveis.push(referenciaPreco);
    
        if (temVariacoes) {
          const areaVariacao = criarElemento(
            "div",
            "variacao-produto"
          );
    
          const idSeletor = `variacao-produto-${indiceProduto}`;
    
          const label = criarElemento(
            "label",
            "",
            "📏 Escolha a variação"
          );
    
          label.htmlFor = idSeletor;
    
          const seletorVariacao = criarElemento("select");
    
          seletorVariacao.id = idSeletor;
    
          variacoes.forEach((variacao, indiceVariacao) => {
            const opcao = criarElemento(
              "option",
              "",
              variacao.nome
            );
    
            opcao.value = String(indiceVariacao);
    
            seletorVariacao.append(opcao);
          });
    
          seletorVariacao.addEventListener("change", () => {
            const indiceSelecionado = Number(
              seletorVariacao.value
            );
    
            const variacao = variacoes[indiceSelecionado];
    
            if (!variacao) {
              return;
            }
    
            // Atualiza o preço-base, sem acumular acréscimos.
            referenciaPreco.precoOriginal = variacao.preco;
            referenciaPreco.variacaoSelecionada = variacao.nome;
    
            // Recalcula com a forma de pagamento atual.
            atualizarPrecos();
          });
    
          areaVariacao.append(label, seletorVariacao);
          info.append(areaVariacao);
        }
    
        info.append(preco, forma, desconto);
    
        // Mantém a disponibilidade do produto.
        const status = obterDisponibilidade(produto);
    
        const areaDisponibilidade = criarElemento("div");
    
        areaDisponibilidade.append(
          criarElemento(
            "span",
            `disponibilidade ${status.classe}`,
            status.texto
          )
        );
    
        info.append(areaDisponibilidade);
        card.append(info);
        catalogo.append(card);
      });
    
      atualizarPrecos();
    }

    /* CLIQUES NAS CATEGORIAS */

    botoesCategorias.forEach(botao => {
      botao.addEventListener("click", () => {
        categoriaAtual = botao.dataset.categoria;
        subcategoriaAtual = "todos";

        criarBotoesSubcategorias();
        atualizarFiltros();
        mostrarProdutos();
      });
    });

    /* INICIALIZAÇÃO */

    obterPagamentoAtual();
    criarBotoesSubcategorias();
    atualizarFiltros();
    mostrarProdutos();
  </script>
</body>
</html>
